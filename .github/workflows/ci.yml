name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Dummy settings so the app can be imported in tests/scans. No real service is contacted.
  LOG_REDACTION_SECRET: ci-only-redaction-secret-not-for-production
  NEXTCLOUD_URL: http://nextcloud.invalid/remote.php/dav/files/ci
  NEXTCLOUD_USERNAME: ci
  NEXTCLOUD_PASSWORD: ci
  SMTP_HOST: smtp.invalid
  SMTP_USERNAME: ci
  SMTP_PASSWORD: ci
  SMTP_FROM_EMAIL: ci@example.invalid
  NOTIFICATION_EMAILS: team@example.invalid
  SECRET_KEY: ci-only-secret-key-not-for-production-0123456789
  API_TOKEN: ci-only-api-token-not-for-production

jobs:
  backend:
    name: Backend – tests, bandit, pip-audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools
          pip install -r requirements.txt bandit pip-audit
      - name: Run tests
        run: pytest -q
      - name: Bandit (medium severity and above fails the build)
        run: bandit -r app -ll -q
      - name: pip-audit (installed environment)
        run: pip-audit --progress-spinner off --strict

  frontend:
    name: Frontend – audit and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: npm audit (high and critical fail the build)
        run: npm audit --audit-level=high
      - name: Build
        env:
          VITE_API_URL: https://api.example.invalid/api
          VITE_API_TOKEN: ci-build-only-token
        run: npm run build

  docker:
    name: Docker – build and Trivy scan (${{ matrix.image }})
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: backend
            context: ./backend
            build-args: ""
          - image: frontend
            context: ./frontend
            build-args: |
              VITE_API_URL=https://api.example.invalid/api
              VITE_API_TOKEN=ci-build-only-token
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: false
          load: true
          tags: datenschutzportal-${{ matrix.image }}:ci
          build-args: ${{ matrix.build-args }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
      - name: Trivy – fail on fixable CRITICAL findings
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: datenschutzportal-${{ matrix.image }}:ci
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Trivy – report HIGH findings (informational)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: datenschutzportal-${{ matrix.image }}:ci
          format: table
          severity: HIGH
          ignore-unfixed: true
          exit-code: "0"
          skip-setup-trivy: true

  secrets:
    name: Secret scan (TruffleHog)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified

  docs:
    name: Docs – mkdocs build --strict
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: docs-requirements.txt
      - run: |
          python -m pip install --upgrade pip setuptools
          pip install -r docs-requirements.txt pip-audit
      - run: mkdocs build --strict -d /tmp/site
      - name: pip-audit (docs tooling)
        run: pip-audit --progress-spinner off --strict
